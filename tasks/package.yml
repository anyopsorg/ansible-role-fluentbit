---
# =============================================================================
# package mode — native fluent-bit under systemd, tailing files
# =============================================================================

- name: Assert offline install has a package to push
  ansible.builtin.assert:
    that:
      - fluentbit_offline_package_src | length > 0
    fail_msg: >-
      fluentbit_install_method is 'offline' but fluentbit_offline_package_src
      is empty — set it to the controller-side path of the fluent-bit
      .deb/.rpm (see defaults/main.yml for download URLs).
  when: fluentbit_install_method == "offline"

- name: Add fluent-bit apt key (Debian/Ubuntu)
  ansible.builtin.get_url:
    url: https://packages.fluentbit.io/fluentbit.key
    dest: /usr/share/keyrings/fluentbit.asc
    mode: "0644"
  become: true
  when: ansible_os_family == "Debian" and fluentbit_install_method == "repo"

- name: Add fluent-bit apt repository (Debian/Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/fluentbit.asc] https://packages.fluentbit.io/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }} {{ ansible_distribution_release }} main"
    filename: fluent-bit
    state: present
  become: true
  when: ansible_os_family == "Debian" and fluentbit_install_method == "repo"

- name: Add fluent-bit yum repository (RHEL/CentOS)
  ansible.builtin.yum_repository:
    name: fluent-bit
    description: Fluent Bit
    # NOTE: no $basearch suffix — packages.fluentbit.io serves repodata directly
    # under centos/<releasever>/ (verified: .../centos/8/repodata/repomd.xml = 200)
    baseurl: https://packages.fluentbit.io/centos/$releasever/
    gpgcheck: true
    gpgkey: https://packages.fluentbit.io/fluentbit.key
  become: true
  when: ansible_os_family == "RedHat" and fluentbit_install_method == "repo"

- name: Install fluent-bit
  ansible.builtin.package:
    name: "{{ fluentbit_package }}"
    state: present
  become: true
  when: fluentbit_install_method == "repo"

- name: Push fluent-bit package and dependencies to the host (offline)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/tmp/{{ item | basename }}"
    mode: "0644"
  become: true
  loop: "{{ fluentbit_offline_deps + [fluentbit_offline_package_src] }}"
  when: fluentbit_install_method == "offline"

# NOTE: one package per apt call, dependencies first. Given several local debs
# at once, the apt module resolves each deb's dependencies against the apt
# index (contacting a mirror) instead of against the other local files; installed
# sequentially, each dep is already present when the next package is checked.
- name: Install fluent-bit from pushed packages (Debian/Ubuntu offline)
  ansible.builtin.apt:
    deb: "/var/tmp/{{ item | basename }}"
  become: true
  loop: "{{ fluentbit_offline_deps + [fluentbit_offline_package_src] }}"
  # Under --check the push above is only simulated, so there is nothing to install.
  when: ansible_os_family == "Debian" and fluentbit_install_method == "offline" and not ansible_check_mode

- name: Install fluent-bit from pushed packages (RHEL/CentOS offline)
  ansible.builtin.yum:
    name: "{{ (fluentbit_offline_deps + [fluentbit_offline_package_src])
              | map('basename') | map('regex_replace', '^', '/var/tmp/') | join(',') }}"
    disable_gpg_check: true
    state: present
  become: true
  when: ansible_os_family == "RedHat" and fluentbit_install_method == "offline" and not ansible_check_mode

- name: Ensure state dir for tail DB and disk buffer
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  become: true
  loop:
    - "{{ fluentbit_state_dir }}"
    - "{{ fluentbit_state_dir }}/buffer"

- name: Deploy parsers.conf
  ansible.builtin.template:
    src: parsers-package.conf.j2
    dest: "{{ fluentbit_conf_dir }}/parsers.conf"
    mode: "0640"
  become: true
  notify: restart fluent-bit (systemd)
  tags: [config]

- name: Deploy fluent-bit.conf
  ansible.builtin.template:
    src: fluent-bit-package.conf.j2
    dest: "{{ fluentbit_conf_dir }}/fluent-bit.conf"
    mode: "0640"           # contains the opensearch password
  become: true
  notify: restart fluent-bit (systemd)
  tags: [config]

- name: Validate configuration (dry run)
  ansible.builtin.command:
    cmd: "{{ fluentbit_binary }} -c {{ fluentbit_conf_dir }}/fluent-bit.conf --dry-run"
  become: true
  changed_when: false
  tags: [config]

- name: Enable and start fluent-bit
  ansible.builtin.systemd:
    name: "{{ fluentbit_service }}"
    enabled: true
    state: started
  become: true
  # On a first --check run the package (and so the unit) is not installed yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Apply config changes now
  ansible.builtin.meta: flush_handlers
  tags: [config]

# --- Verify ----------------------------------------------------------------
- name: Wait for the fluent-bit health endpoint
  ansible.builtin.uri:
    url: "http://{{ '127.0.0.1' if fluentbit_http_listen in ['0.0.0.0', '127.0.0.1'] else fluentbit_http_listen }}:{{ fluentbit_http_port }}/api/v1/health"
    use_proxy: false
    return_content: true
  register: fluentbit_health
  until: fluentbit_health.status == 200
  retries: 12
  delay: 5
  when: fluentbit_http_server | bool and not ansible_check_mode
  tags: [verify]

- name: Report deployment state
  ansible.builtin.debug:
    msg: >-
      fluent-bit (package) running on {{ inventory_hostname }}, tailing
      {{ fluentbit_tail_inputs | map(attribute='path') | join(', ') }} ->
      {{ fluentbit_os_host }} as {{ fluentbit_logstash_prefix }}-YYYY.MM.DD
  tags: [verify]
